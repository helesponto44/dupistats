<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Stats Dashboard - MOSS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #121212;
    --bg-panel: #1e1e1e;
    --accent: #ffcc00;
    --text-main: #e0e0e0;
    --text-dim: #888;
    --border: #333;
    --hover: #2a2a2a;
    --icon-size: 32px; 
    --transition-speed: 0.01s;
  }

  body {
    font-family: 'Google Sans Code', monospace;
    background: var(--bg-dark);
    color: var(--text-main);
    margin: 0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 250px;
    min-width: 250px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
    z-index: 10;
  }

  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .search-container {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }

  .search-box {
    flex-grow: 1;
    padding: 8px;
    background: #121212;
    border: 1px solid var(--border);
    color: white;
    border-radius: 4px;
    font-family: inherit;
  }

  .sort-toggle {
    width: 32px;
    height: 32px;
    cursor: pointer;
    background: transparent;
    border: none;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sort-toggle:hover { background: var(--hover); }
  .sort-toggle img { width: 20px; height: 20px; image-rendering: pixelated; }

  #players-list {
    flex-grow: 1;
    overflow-y: auto;
  }

  .player {
    padding: 12px 20px;
    cursor: pointer;
    border-bottom: 1px solid #252525;
    transition: background 0.2s;
    font-size: 14px;
  }

  .player:hover { background: var(--hover); }
  .player.active { 
    background: var(--hover); 
    border-left: 4px solid var(--accent);
  }

  /* Contenido */
  .content {
    flex-grow: 1;
    padding: 30px;
    overflow-y: auto;
    background: var(--bg-dark);
    position: relative;
  }

  .stats-wrapper {
    transition: filter var(--transition-speed) ease, opacity var(--transition-speed) ease;
  }

  .loading-active .stats-wrapper {
    filter: blur(4px);
    opacity: 0.5;
    pointer-events: none;
  }

  .content-header {
    margin-bottom: 30px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .header-stats-group {
    display: flex;
    gap: 30px;
    text-align: right;
  }

  .play-time-label {
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    display: block;
  }

  .play-time-value {
    font-size: 24px;
    font-weight: bold;
  }

  .uuid-badge {
    display: inline-block;
    background: #252525;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .stat-category {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg-panel);
  }

  .category-header {
    background: var(--bg-panel);
    padding: 12px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }

  .category-header:hover { background: var(--hover); }
  
  .category-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-grow: 1;
    cursor: pointer;
  }

  .category-title {
    font-weight: bold;
    color: var(--accent);
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 1px;
  }

  .category-search-input {
    background: transparent;
    border: none;
    color: var(--accent);
    font-family: inherit;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 1px;
    outline: none;
    width: 100%;
    display: none; /* Oculto por defecto */
  }

  .category-actions {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .btn-cat-search {
    width: 18px;
    height: 18px;
    cursor: pointer;
    image-rendering: pixelated;
    opacity: 0.6;
    transition: opacity 0.2s;
  }

  .btn-cat-search:hover { opacity: 1; }

  .category-content {
    padding: 20px;
    display: none; 
    background: #161616;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 80px;
  }

  .category-content.open { display: grid; }
  .category-header.open .chevron::before { transform: rotate(90deg); }

  .clear-filter {
    grid-column: 1 / -1;
    color: #ff4444;
    font-size: 11px;
    cursor: pointer;
    margin-bottom: 10px;
    display: none;
    align-items: center;
    gap: 4px;
  }

  .sub-category-title {
    grid-column: 1 / -1;
    padding: 10px 0;
    margin-top: 10px;
    border-bottom: 1px solid #333;
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    opacity: 0.8;
  }

  .stat-row {
    padding: 10px 0;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }

  .stat-info {
    display: flex;
    align-items: center;
    gap: 12px;
    overflow: hidden;
  }

  .stat-icon {
    width: var(--icon-size);
    height: var(--icon-size);
    image-rendering: pixelated; 
    object-fit: contain;
    flex-shrink: 0;
  }

  .stat-label { 
    color: #bbb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat-value { font-weight: bold; color: white; font-size: 1.1em; }

  .chevron::before {
    content: '▶';
    display: inline-block;
    transition: transform 0.2s;
    font-size: 10px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

  @media (max-width: 1200px) {
    .category-content { grid-template-columns: repeat(2, 1fr); gap: 12px 25px; }
  }
  @media (max-width: 700px) {
    .category-content { grid-template-columns: 1fr; }
  }
</style>
</head>

<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <h2 style="margin:0; font-size: 1.2em;">MOSS Stats</h2>
    <div class="search-container">
        <input type="text" id="search" class="search-box" placeholder="Buscar jugador...">
        <div id="btn-sort" class="sort-toggle" title="Cambiar orden">
            <img id="sort-icon" src="textures/gui/by_time.png" alt="sort">
        </div>
    </div>
  </div>
  <div id="players-list"></div>
</aside>

<main class="content" id="main-content">
  <div class="stats-wrapper" id="stats-wrapper">
    <div id="stats-header">
      <div style="text-align: center; color: var(--text-dim); margin-top: 150px;">
        <h1>Seleccioná un jugador</h1>
      </div>
    </div>

    <div id="categories-container" style="display: none;">
      <div class="stat-category" id="sec-distance">
          <div class="category-header" data-cat-id="distance">
            <div class="category-left" onclick="toggleCategory(this.parentElement)">
                <span class="category-title">Distancia Recorrida</span>
                <input type="text" class="category-search-input" placeholder="BUSCAR..." onclick="event.stopPropagation()">
            </div>
            <div class="category-actions">
                <img src="textures/gui/search.png" class="btn-cat-search" onclick="toggleSearch(this)" title="Buscar en categoría">
                <span class="chevron" onclick="toggleCategory(this.parentElement.parentElement)"></span>
            </div>
          </div>
          <div class="category-content" id="content-distance"></div>
      </div>

      <div class="stat-category" id="sec-combat">
          <div class="category-header" data-cat-id="combat">
            <div class="category-left" onclick="toggleCategory(this.parentElement)">
                <span class="category-title">Combate</span>
                <input type="text" class="category-search-input" placeholder="BUSCAR..." onclick="event.stopPropagation()">
            </div>
            <div class="category-actions">
                <img src="textures/gui/search.png" class="btn-cat-search" onclick="toggleSearch(this)" title="Buscar en categoría">
                <span class="chevron" onclick="toggleCategory(this.parentElement.parentElement)"></span>
            </div>
          </div>
          <div class="category-content" id="content-combat"></div>
      </div>

      <div id="dynamic-categories"></div>

      <div class="stat-category" id="sec-interactions">
          <div class="category-header" data-cat-id="interactions">
            <div class="category-left" onclick="toggleCategory(this.parentElement)">
                <span class="category-title">Interacciones</span>
                <input type="text" class="category-search-input" placeholder="BUSCAR..." onclick="event.stopPropagation()">
            </div>
            <div class="category-actions">
                <img src="textures/gui/search.png" class="btn-cat-search" onclick="toggleSearch(this)" title="Buscar en categoría">
                <span class="chevron" onclick="toggleCategory(this.parentElement.parentElement)"></span>
            </div>
          </div>
          <div class="category-content" id="content-interactions"></div>
      </div>

      <div class="stat-category" id="sec-various">
          <div class="category-header" data-cat-id="various">
            <div class="category-left" onclick="toggleCategory(this.parentElement)">
                <span class="category-title">Varios</span>
                <input type="text" class="category-search-input" placeholder="BUSCAR..." onclick="event.stopPropagation()">
            </div>
            <div class="category-actions">
                <img src="textures/gui/search.png" class="btn-cat-search" onclick="toggleSearch(this)" title="Buscar en categoría">
                <span class="chevron" onclick="toggleCategory(this.parentElement.parentElement)"></span>
            </div>
          </div>
          <div class="category-content" id="content-various"></div>
      </div>
    </div>
  </div>
</main>

<script src="statMap.js"></script>

<script>
const API_BASE = "https://moss-proxy-orpin.vercel.app/api";
const playersListDiv = document.getElementById("players-list");
const mainContent = document.getElementById("main-content");
const statsHeader = document.getElementById("stats-header");
const categoriesContainer = document.getElementById("categories-container");
const dynamicCategories = document.getElementById("dynamic-categories");
const searchInput = document.getElementById("search");
const btnSort = document.getElementById("btn-sort");
const sortIcon = document.getElementById("sort-icon");

let rawPlayersData = [];
let currentSort = 'time';
let openCategories = new Set();
let categoryFilters = {}; 
let lastPlayerData = null;

const vanillaSections = [
  { id: "minecraft:killed", title: "Entidades Asesinadas" },
  { id: "minecraft:killed_by", title: "Asesinado por" },
  { id: "minecraft:mined", title: "Bloques Minados" },
  { id: "minecraft:crafted", title: "Objetos Crafteados" },
  { id: "minecraft:used", title: "Objetos Usados" },
  { id: "minecraft:picked_up", title: "Items Recogidos" },
  { id: "minecraft:dropped", title: "Items Soltados" }
];

const distStatsApie = ["minecraft:aviate_one_cm", "minecraft:climb_one_cm", "minecraft:walk_one_cm", "minecraft:sprint_one_cm", "minecraft:crouch_one_cm", "minecraft:sneak_time", "minecraft:fall_one_cm", "minecraft:swim_one_cm", "minecraft:walk_on_water_one_cm", "minecraft:walk_under_water_one_cm", "minecraft:jump"];
const distStatsMontado = ["minecraft:pig_one_cm", "minecraft:minecart_one_cm", "minecraft:happy_ghast_one_cm", "minecraft:strider_one_cm", "minecraft:horse_one_cm", "minecraft:nautilus_one_cm", "minecraft:boat_one_cm"];
const combatStats = ["damage_absorbed", "damage_blocked_by_shield", "damage_dealt_absorbed", "damage_dealt_resisted", "damage_resisted", "damage_taken", "deaths", "mob_kills", "player_kills"].map(s => "minecraft:" + s);
const interactionKeywords = ["interaction_", "open_", "bell_ring", "enchanted_item", "treasure_fished", "talk_to_villager", "eat_cake"];

function initStructure() {
  dynamicCategories.innerHTML = vanillaSections.map(section => `
    <div class="stat-category" id="sec-${section.id.replace(':', '-')}">
      <div class="category-header" data-cat-id="${section.id}">
        <div class="category-left" onclick="toggleCategory(this.parentElement)">
            <span class="category-title">${section.title}</span>
            <input type="text" class="category-search-input" placeholder="BUSCAR..." onclick="event.stopPropagation()">
        </div>
        <div class="category-actions">
            <img src="textures/gui/search.png" class="btn-cat-search" onclick="toggleSearch(this)" title="Buscar en categoría">
            <span class="chevron" onclick="toggleCategory(this.parentElement.parentElement)"></span>
        </div>
      </div>
      <div class="category-content" id="content-${section.id.replace(':', '-')}"></div>
    </div>
  `).join('');

  // Delegación de eventos para inputs de categoría
  document.querySelectorAll('.category-search-input').forEach(input => {
    input.addEventListener('input', (e) => {
        const catId = e.target.closest('.category-header').getAttribute('data-cat-id');
        categoryFilters[catId] = e.target.value.toLowerCase();
        if(lastPlayerData) refreshUI();
    });

    // Cierre estricto: al perder foco se oculta siempre
    input.addEventListener('blur', (e) => {
        const header = e.target.closest('.category-header');
        const title = header.querySelector('.category-title');
        e.target.style.display = "none";
        title.style.display = "inline";
    });
  });
}

function toggleSearch(btn) {
    const header = btn.closest('.category-header');
    const title = header.querySelector('.category-title');
    const input = header.querySelector('.category-search-input');

    // Si está oculto, lo mostramos y damos foco
    if (input.style.display === "none" || input.style.display === "") {
        title.style.display = "none";
        input.style.display = "inline";
        input.focus();
    } else {
        // Si ya está visible (clic repetido en lupa), lo ocultamos (el blur también se disparará)
        input.style.display = "none";
        title.style.display = "inline";
    }
}

function clearCategoryFilter(catId) {
    categoryFilters[catId] = "";
    const header = document.querySelector(`.category-header[data-cat-id="${catId}"]`);
    const input = header.querySelector('.category-search-input');
    const title = header.querySelector('.category-title');
    input.value = "";
    input.style.display = "none";
    title.style.display = "inline";
    if(lastPlayerData) refreshUI();
}

initStructure();

fetch(`${API_BASE}/players`)
  .then(res => res.json())
  .then(data => {
    rawPlayersData = data;
    renderSortedList();
  });

function renderSortedList() {
  let listToRender = [...rawPlayersData];
  const term = searchInput.value.toLowerCase();
  if (term) listToRender = listToRender.filter(p => p.name.toLowerCase().includes(term));

  if (currentSort === 'az') {
    listToRender.sort((a, b) => {
      const nameA = a.name.toLowerCase().replace(/^\./, '');
      const nameB = b.name.toLowerCase().replace(/^\./, '');
      return nameA.localeCompare(nameB);
    });
  } else {
    listToRender.sort((a, b) => (a.rank || 0) - (b.rank || 0));
  }
  renderPlayerList(listToRender);
}

function renderPlayerList(list) {
  playersListDiv.innerHTML = "";
  list.forEach(p => {
    const div = document.createElement("div");
    div.className = "player";
    div.textContent = p.name;
    div.onclick = () => {
      if(div.classList.contains('active')) return;
      document.querySelectorAll('.player').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      loadPlayerStats(p.uuid, p.name);
    };
    playersListDiv.appendChild(div);
  });
}

btnSort.onclick = () => {
    currentSort = (currentSort === 'time') ? 'az' : 'time';
    sortIcon.src = `textures/gui/by_${currentSort}.png`;
    renderSortedList();
};

searchInput.oninput = () => renderSortedList();

function getIconPath(key, categoryId) {
  const fileName = key.split(':')[1]; 
  if (categoryId === "minecraft:custom") return `textures/custom/${fileName}.png`;
  if (categoryId === "minecraft:killed" || categoryId === "minecraft:killed_by") return `textures/entities/${fileName}.png`;
  return `textures/items/${fileName}.png`;
}

function matchesFilter(key, catId) {
    const filter = categoryFilters[catId];
    if (!filter) return true;
    
    const terms = filter.split(',').map(t => t.trim()).filter(t => t !== "");
    if (terms.length === 0) return true;

    const label = (STAT_MAP[key]?.label || "").toLowerCase();
    const id = key.toLowerCase();

    return terms.some(term => label.includes(term) || id.includes(term));
}

function createStatRow(key, value, categoryId = "minecraft:custom") {
  const stat = STAT_MAP[key];
  const label = stat?.label || key.replace('minecraft:', '').replace(/_/g, ' ');
  const formatted = stat?.format ? stat.format(value) : value.toLocaleString();
  const iconSrc = getIconPath(key, categoryId);

  return `
    <div class="stat-row">
      <div class="stat-info">
        <img src="${iconSrc}" class="stat-icon" onerror="this.onerror=null; this.src='textures/generic.png'">
        <span class="stat-label" title="${label}">${label}</span>
      </div>
      <span class="stat-value">${formatted}</span>
    </div>
  `;
}

async function loadPlayerStats(uuid, name) {
  mainContent.classList.add('loading-active');
  try {
    const res = await fetch(`${API_BASE}/player?uuid=${uuid}`);
    const data = await res.json();
    lastPlayerData = { data, name, uuid };
    refreshUI();
  } catch (err) {
    console.error(err);
    statsHeader.innerHTML = "<h1>Error al conectar con la API</h1>";
  } finally {
    setTimeout(() => mainContent.classList.remove('loading-active'), 10);
  }
}

function refreshUI() {
    const { data, name, uuid } = lastPlayerData;
    const allStats = data.stats?.stats || {};
    const customData = allStats["minecraft:custom"] || {};

    const playTimeTicks = customData["minecraft:play_time"] || 0;
    const playTimeFormatted = STAT_MAP["minecraft:play_time"]?.format(playTimeTicks) || "0s";

    statsHeader.innerHTML = `
      <div class="content-header">
        <div>
          <h1 style="margin: 0 0 5px 0;">${name}</h1>
          <span class="uuid-badge">UUID: ${uuid}</span>
        </div>
        <div class="header-stats-group">
          <div><span class="play-time-label">Bajas</span><span class="play-time-value">${(customData["minecraft:mob_kills"] || 0).toLocaleString()}</span></div>
          <div><span class="play-time-label">Muertes</span><span class="play-time-value">${(customData["minecraft:deaths"] || 0).toLocaleString()}</span></div>
          <div><span class="play-time-label">Tiempo</span><span class="play-time-value">${playTimeFormatted}</span></div>
        </div>
      </div>
    `;

    categoriesContainer.style.display = "block";
    const usedKeys = new Set(["minecraft:play_time", "minecraft:deaths", "minecraft:mob_kills"]);

    renderDistance(customData, usedKeys);
    renderCombat(customData, usedKeys);
    vanillaSections.forEach(section => renderVanillaSection(section, allStats[section.id] || {}));
    renderInteractions(customData, usedKeys);
    renderVarious(customData, usedKeys);
    applyPersistence();
}

function getClearBtn(catId) {
    return categoryFilters[catId] ? `<div class="clear-filter" style="display:flex" onclick="clearCategoryFilter('${catId}')">Limpiar filtros ✖</div>` : '';
}

function renderDistance(data, used) {
  const catId = 'distance';
  const total = [...distStatsApie, ...distStatsMontado].reduce((acc, k) => acc + (data[k] || 0), 0);
  const sec = document.getElementById('sec-distance');
  
  const apie = distStatsApie.filter(k => data[k] && matchesFilter(k, catId)).map(k => { used.add(k); return createStatRow(k, data[k]); });
  const montado = distStatsMontado.filter(k => data[k] && matchesFilter(k, catId)).map(k => { used.add(k); return createStatRow(k, data[k]); });

  if (apie.length === 0 && montado.length === 0 && !categoryFilters[catId]) { sec.style.display = "none"; return; }
  sec.style.display = "block";

  let html = getClearBtn(catId);
  html += `<div class="stat-row" style="grid-column: 1/-1; border-bottom: 2px solid var(--accent);"><span class="stat-label" style="color:var(--accent); font-weight:bold;">TOTAL RECORRIDO</span><span class="stat-value" style="color:var(--accent);">${Math.round(total/100)} bloques</span></div>`;
  if(apie.length) html += `<div class="sub-category-title">A pie</div>` + apie.join('');
  if(montado.length) html += `<div class="sub-category-title">Montado</div>` + montado.join('');
  document.getElementById('content-distance').innerHTML = html;
}

function renderCombat(data, used) {
  const catId = 'combat';
  const entries = combatStats.filter(k => data[k] && matchesFilter(k, catId)).map(k => { used.add(k); return createStatRow(k, data[k]); });
  const sec = document.getElementById('sec-combat');
  if(!entries.length && !categoryFilters[catId]) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  document.getElementById('content-combat').innerHTML = getClearBtn(catId) + entries.join('');
}

function renderVanillaSection(section, data) {
  const catId = section.id;
  const entries = Object.entries(data).filter(([k,v]) => matchesFilter(k, catId)).sort((a,b) => b[1]-a[1]);
  const sec = document.getElementById(`sec-${section.id.replace(':', '-')}`);
  if(!entries.length && !categoryFilters[catId]) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  const total = Object.values(data).reduce((acc, v) => acc + v, 0);
  let html = getClearBtn(catId);
  html += `<div class="stat-row" style="grid-column: 1/-1; border-bottom: 2px solid var(--accent);"><span class="stat-label" style="color:var(--accent); font-weight:bold;">TOTAL</span><span class="stat-value" style="color:var(--accent);">${total.toLocaleString()}</span></div>`;
  html += entries.map(([k, v]) => createStatRow(k, v, section.id)).join('');
  document.getElementById(`content-${section.id.replace(':', '-')}`).innerHTML = html;
}

function renderInteractions(data, used) {
  const catId = 'interactions';
  const entries = Object.entries(data).filter(([k, v]) => interactionKeywords.some(kw => k.includes(kw)) && v > 0 && matchesFilter(k, catId));
  const sec = document.getElementById('sec-interactions');
  if(!entries.length && !categoryFilters[catId]) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  document.getElementById('content-interactions').innerHTML = getClearBtn(catId) + entries.map(([k, v]) => { used.add(k); return createStatRow(k, v); }).join('');
}

function renderVarious(data, used) {
  const catId = 'various';
  const entries = Object.entries(data).filter(([k, v]) => !used.has(k) && v > 0 && matchesFilter(k, catId)).sort((a,b) => b[1]-a[1]);
  const sec = document.getElementById('sec-various');
  if(!entries.length && !categoryFilters[catId]) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  document.getElementById('content-various').innerHTML = getClearBtn(catId) + entries.map(([k, v]) => createStatRow(k, v)).join('');
}

function toggleCategory(header) {
  const id = header.getAttribute('data-cat-id');
  const content = header.nextElementSibling;
  if (content.classList.contains('open')) {
    content.classList.remove('open');
    header.classList.remove('open');
    openCategories.delete(id);
  } else {
    content.classList.add('open');
    header.classList.add('open');
    openCategories.add(id);
  }
}

function applyPersistence() {
  document.querySelectorAll('.category-header').forEach(header => {
    const id = header.getAttribute('data-cat-id');
    const content = header.nextElementSibling;
    const title = header.querySelector('.category-title');
    const input = header.querySelector('.category-search-input');

    // Restaurar estado de expansión
    if (openCategories.has(id)) {
      content.classList.add('open');
      header.classList.add('open');
    }

    // Restaurar el valor del input si existe un filtro, pero mantenerlo oculto (según requerimiento de Blur)
    if (categoryFilters[id]) {
        input.value = categoryFilters[id];
    }
  });
}
</script>
